<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
<title id="title">Event Management Database ER Diagram</title>
<desc id="desc">Six PostgreSQL tables. User has organizers and tickets. Organizer has events. Events have tickets and event-sponsor associations. Sponsor has event-sponsor associations. Every relationship is one to zero or more.</desc>
